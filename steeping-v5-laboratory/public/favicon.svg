<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich gold brand gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd89b" />
      <stop offset="50%" stop-color="#d4922a" />
      <stop offset="100%" stop-color="#723c00" />
    </linearGradient>
    
    <!-- Subtle gold glow for outer shapes -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pointy-Topped Hexagong Outer Shape -->
  <path 
    d="M 256 24 L 456 140 L 456 372 L 256 488 L 56 372 L 56 140 Z" 
    stroke="url(#gold-grad)" 
    stroke-width="12" 
    fill="none" 
    filter="url(#gold-glow)" 
    stroke-linejoin="round"
  />

  <!-- Pointy-Topped Inner Concentric Hexagong -->
  <path 
    d="M 256 60 L 425 158 L 425 354 L 256 452 L 87 354 L 87 158 Z" 
    stroke="url(#gold-grad)" 
    stroke-width="4" 
    fill="none" 
    opacity="0.5" 
    stroke-dasharray="8,8" 
    stroke-linejoin="round"
  />

  <!-- Concentric Dotted Sonic Ring -->
  <circle 
    cx="256" 
    cy="256" 
    r="120" 
    stroke="url(#gold-grad)" 
    stroke-width="2.5" 
    stroke-dasharray="4,8" 
    fill="none" 
    opacity="0.35" 
  />

  <!-- Organic, Curved Tea Leaf (Introspective Vessel) -->
  <path 
    d="M 256 390 C 180 330, 170 220, 280 160 C 330 220, 320 340, 256 390 Z" 
    fill="url(#gold-grad)" 
    fill-opacity="0.12" 
    stroke="url(#gold-grad)" 
    stroke-width="8" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Spinal Vein -->
  <path 
    d="M 256 370 Q 250 270 276 175" 
    stroke="url(#gold-grad)" 
    stroke-width="4" 
    stroke-linecap="round" 
    fill="none" 
    opacity="0.7" 
  />

  <!-- Side Ribs (Delicate curves) -->
  <path d="M 253 320 Q 212 290 202 280" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 255 310 Q 295 280 310 270" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 258 260 Q 220 230 215 220" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 262 250 Q 300 220 305 210" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Rising Steam Plumes (Metaphysical Introspection) -->
  <!-- Left wave -->
  <path 
    d="M 270 150 Q 220 100 260 50" 
    stroke="url(#gold-grad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    fill="none" 
    opacity="0.5" 
  />
  <!-- Central wave -->
  <path 
    d="M 280 145 C 290 105, 230 85, 256 40" 
    stroke="url(#gold-grad)" 
    stroke-width="4.5" 
    stroke-linecap="round" 
    fill="none" 
    opacity="0.75" 
  />
  <!-- Right wave -->
  <path 
    d="M 290 155 Q 330 110 290 60" 
    stroke="url(#gold-grad)" 
    stroke-width="3" 
    stroke-linecap="round" 
    fill="none" 
    opacity="0.5" 
  />

  <!-- Scattered Glowing Stardust (Insights / Stars) -->
  <!-- North Star (Primary Insight) -->
  <circle cx="256" cy="110" r="5" fill="#fff" filter="url(#gold-glow)" />
  <circle cx="256" cy="110" r="8" fill="none" stroke="#ffd89b" stroke-width="1" opacity="0.7" />
  
  <!-- Outer Constellation dots -->
  <circle cx="180" cy="140" r="4.5" fill="#ffd89b" opacity="0.8" />
  <circle cx="332" cy="140" r="4.5" fill="#ffd89b" opacity="0.8" />
  <circle cx="140" cy="220" r="3.5" fill="#ffd89b" opacity="0.6" />
  <circle cx="372" cy="220" r="3.5" fill="#ffd89b" opacity="0.6" />
  <circle cx="150" cy="310" r="3" fill="#ffd89b" opacity="0.4" />
  <circle cx="362" cy="310" r="3" fill="#ffd89b" opacity="0.4" />
  <circle cx="256" cy="420" r="3.5" fill="#ffd89b" opacity="0.5" />
  <circle cx="200" cy="360" r="2.5" fill="#ffd89b" opacity="0.4" />
  <circle cx="312" cy="360" r="2.5" fill="#ffd89b" opacity="0.4" />
</svg>
